<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>R³Coach</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <h1>R<sup>3</sup>Coach</h1>
    <p>Reconstruction, Recommendation, and Responsive Guidance</p>

    </div>
  </main>
  <script type="module" src="/app.mjs"></script>
</body>
</html>
